<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Net Storage - Pictures</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 40%, #fbc2eb 80%, #a1c4fd 100%);
      background-size: 300% 300%;
      animation: gradientFlow 18s ease infinite;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .header {
      width: 100%;
      padding: 20px 30px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 {
      font-size: 2.1rem;
      font-weight: 700;
      background: linear-gradient(to right, #ec4899, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 50px;
      color: #1e293b;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.4);
      transform: translateX(-4px);
    }
    .upload-section {
      width: 100%;
      max-width: 900px;
      margin: 40px auto 50px;
      padding: 0 20px;
      text-align: center;
    }
    .upload-box {
      background: rgba(255,255,255,0.28);
      backdrop-filter: blur(16px);
      border: 2px dashed rgba(236,72,153,0.5);
      border-radius: 24px;
      padding: 60px 40px;
      cursor: pointer;
      transition: all 0.35s ease;
    }
    .upload-box:hover {
      border-color: #ec4899;
      background: rgba(255,255,255,0.38);
      box-shadow: 0 15px 40px rgba(236,72,153,0.2);
    }
    .upload-icon {
      font-size: 4.5rem;
      color: #ec4899;
      margin-bottom: 20px;
    }
    .upload-text {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .upload-subtext {
      color: #475569;
      font-size: 1.05rem;
    }
    .pictures-grid {
      width: 100%;
      max-width: 1200px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }
    .picture-card {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      transition: all 0.4s ease;
      cursor: pointer;
      aspect-ratio: 1 / 1;
      position: relative;
    }
    .picture-card:hover {
      transform: translateY(-12px) scale(1.04);
      box-shadow: 0 20px 50px rgba(236,72,153,0.3);
    }
    .thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .picture-card:hover .thumbnail {
      transform: scale(1.15);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.6));
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }
    .picture-card:hover .overlay {
      opacity: 1;
    }
    .overlay-text {
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      text-align: center;
    }
    .filters {
      width: 100%;
      max-width: 900px;
      padding: 0 20px 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    .search-bar {
      flex: 1;
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 50px;
      background: rgba(255,255,255,0.2);
      font-size: 1rem;
      color: #1e293b;
    }
    .storage-info {
      width: 100%;
      max-width: 900px;
      padding: 20px;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      text-align: center;
      margin-bottom: 40px;
      font-weight: 500;
      color: #334155;
    }
    @media (max-width: 768px) {
      .pictures-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
      .header h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <button class="back-btn">
      <i class="fas fa-arrow-left"></i> Back to Dashboard
    </button>
    <h1>Pictures</h1>
  </header>
  <div class="upload-section">
    <div class="upload-box" id="uploadBox">
      <i class="fas fa-cloud-upload-alt upload-icon"></i>
      <div class="upload-text">Upload New Pictures</div>
      <div class="upload-subtext">Drag & drop or click to browse • JPG, PNG, HEIC, RAW supported • Max 100MB per file</div>
    </div>
  </div>
  <div class="filters">
    <input type="text" class="search-bar" placeholder="Search photos by date, place, or tag...">
    <button style="padding:14px 24px; background:rgba(255,255,255,0.25); border:none; border-radius:50px; font-weight:600; cursor:pointer;">Recent</button>
    <button style="padding:14px 24px; background:rgba(255,255,255,0.25); border:none; border-radius:50px; font-weight:600; cursor:pointer;">Favorites</button>
  </div>
  <div class="pictures-grid" id="picturesGrid">
    <!-- Pictures added here dynamically -->
  </div>
  <div class="storage-info">
    <strong>Photos Storage Used:</strong> <span id="storageUsed">0.0 GB</span> of 50 GB free • <a href="#" style="color:#ec4899; text-decoration:none;">Upgrade for unlimited photos</a>
  </div>

  <script>
    const uploadBox = document.getElementById('uploadBox');
    const picturesGrid = document.getElementById('picturesGrid');
    const LOCAL_KEY = 'net-storage-pictures';

    // Hidden file input
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/jpeg,image/png,image/gif,image/webp,image/heic,image/heif';
    fileInput.multiple = true;
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    // Click → open file picker
    uploadBox.addEventListener('click', () => fileInput.click());

    // Drag & drop styling
    uploadBox.addEventListener('dragover', e => {
      e.preventDefault();
      uploadBox.style.borderColor = '#ec4899';
      uploadBox.style.background = 'rgba(236,72,153,0.15)';
    });

    uploadBox.addEventListener('dragleave', () => {
      uploadBox.style.borderColor = 'rgba(236,72,153,0.5)';
      uploadBox.style.background = 'rgba(255,255,255,0.28)';
    });

    uploadBox.addEventListener('drop', e => {
      e.preventDefault();
      uploadBox.style.borderColor = 'rgba(236,72,153,0.5)';
      uploadBox.style.background = 'rgba(255,255,255,0.28)';
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', () => {
      handleFiles(fileInput.files);
      fileInput.value = '';
    });

    function handleFiles(files) {
      if (!files?.length) return;

      Array.from(files).forEach(file => {
        if (!file.type.startsWith('image/')) {
          alert(`"${file.name}" is not an image file.`);
          return;
        }

        const url = URL.createObjectURL(file);

        // Create preview card
        const card = document.createElement('div');
        card.className = 'picture-card';
        card.innerHTML = `
          <img class="thumbnail" src="${url}" alt="${file.name}">
          <div class="overlay">
            <div class="overlay-text">${file.name} • Just now</div>
          </div>
        `;

        picturesGrid.prepend(card);

        // Save small base64 thumbnail + metadata to localStorage
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 200;
          canvas.height = 200 * (img.height / img.width);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          const thumbBase64 = canvas.toDataURL('image/jpeg', 0.7);

          const data = {
            name: file.name,
            size: file.size,
            date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
            thumbnail: thumbBase64
          };

          savePicture(data);
          URL.revokeObjectURL(url); // free memory after thumbnail created
        };
        img.src = url;
      });
    }

    function savePicture(data) {
      let pictures = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
      pictures.unshift(data);
      localStorage.setItem(LOCAL_KEY, JSON.stringify(pictures));
      updateStorageUsed();
    }

    function loadPictures() {
      const saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
      saved.forEach(pic => {
        const card = document.createElement('div');
        card.className = 'picture-card';
        card.innerHTML = `
          <img class="thumbnail" src="${pic.thumbnail}" alt="${pic.name}">
          <div class="overlay">
            <div class="overlay-text">${pic.name} • ${pic.date}</div>
          </div>
        `;
        picturesGrid.appendChild(card);
      });
      updateStorageUsed();
    }

    function updateStorageUsed() {
      const pictures = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
      const totalBytes = pictures.reduce((sum, p) => sum + p.size, 0);
      const gb = (totalBytes / (1024 ** 3)).toFixed(1);
      document.getElementById('storageUsed').textContent = `${gb} GB`;
    }

    // Load saved pictures on start
    loadPictures();
  </script>
</body>
</html>
