<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Net Storage - Create Account</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 40%, #fbc2eb 80%, #a1c4fd 100%);
      background-size: 300% 300%;
      animation: gradientFlow 18s ease infinite;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header {
      width: 100%;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.35);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(to right, #3b82f6, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .form-container {
      width: 100%;
      max-width: 480px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .signup-box {
      background: rgba(255,255,255,0.28);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 15px 40px rgba(59,130,246,0.18);
    }

    .signup-box h2 {
      text-align: center;
      margin-bottom: 32px;
      font-size: 1.6rem;
      color: #1e293b;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #334155;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 12px;
      background: rgba(255,255,255,0.35);
      font-size: 1.05rem;
      color: #1e293b;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }

    .photo-area {
      margin: 32px 0;
      text-align: center;
    }

    #upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 32px;
      background: rgba(59,130,246,0.25);
      border: 2px dashed #3b82f6;
      border-radius: 16px;
      color: #1e293b;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    #upload-btn:hover {
      background: rgba(59,130,246,0.4);
      transform: translateY(-3px);
    }

    #preview-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #profile-preview {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.6);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    #submit-btn {
      padding: 16px 48px;
      background: linear-gradient(to right, #3b82f6, #8b5cf6);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 25px rgba(59,130,246,0.3);
    }

    #submit-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 40px rgba(59,130,246,0.45);
    }

    #photo-input {
      display: none;
    }

    .message {
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .success {
      color: #059669;
    }

    .error {
      color: #dc2626;
    }

    @media (max-width: 500px) {
      .signup-box { padding: 32px 24px; }
      .header h1 { font-size: 2.4rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>NET STORAGE</h1>
  </header>

  <div class="form-container">
    <div class="signup-box">
      <h2>Create Your Account</h2>

      <form id="signup-form">
        <div class="form-group">
          <label for="netid">NetID</label>
          <input type="text" id="netid" placeholder="e.g. net12345" required>
        </div>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="e.g. Aime Ndayisenga" required>
        </div>

        <div class="form-group">
          <label for="pin">PIN (4-6 digits)</label>
          <input type="password" id="pin" placeholder="••••" maxlength="6" required>
        </div>

        <div class="form-group">
          <label for="confirm-pin">Confirm PIN</label>
          <input type="password" id="confirm-pin" placeholder="••••" maxlength="6" required>
        </div>

        <div class="photo-area">
          <label id="upload-btn" for="photo-input">
            <i class="fas fa-camera"></i> Upload Photo (required)
          </label>

          <input type="file" id="photo-input" accept="image/*" required>

          <div id="preview-container">
            <img id="profile-preview" src="" alt="Profile Preview">
            <button type="submit" id="submit-btn">Create Account</button>
          </div>
        </div>

        <div class="message error" id="errorMsg"></div>
        <div class="message success" id="successMsg"></div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('signup-form');
    const netid = document.getElementById('netid');
    const nameInput = document.getElementById('name');
    const pin = document.getElementById('pin');
    const confirmPin = document.getElementById('confirm-pin');
    const photoInput = document.getElementById('photo-input');
    const uploadBtn = document.getElementById('upload-btn');
    const previewContainer = document.getElementById('preview-container');
    const profilePreview = document.getElementById('profile-preview');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    // Show preview when photo is selected
    photoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          profilePreview.src = event.target.result;
          uploadBtn.style.display = 'none';
          previewContainer.style.display = 'flex';
        };
        reader.readAsDataURL(file);
      }
    });

    // Form submission
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      // Reset messages
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      // Validation
      if (!netid.value.trim()) {
        showError('Please enter your NetID');
        return;
      }
      if (!nameInput.value.trim()) {
        showError('Please enter your full name');
        return;
      }
      if (!pin.value || pin.value.length < 4) {
        showError('PIN must be 4-6 digits');
        return;
      }
      if (pin.value !== confirmPin.value) {
        showError('PINs do not match');
        return;
      }
      if (!photoInput.files || photoInput.files.length === 0) {
        showError('Please upload a profile photo');
        return;
      }

      // All good → show success and redirect
      successMsg.textContent = 'Account created successfully! Redirecting to verification...';
      successMsg.style.display = 'block';

      setTimeout(() => {
        window.location.href = 'verfyed.html'; // ← redirects to verfyed.html
      }, 1800);
    });

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
      setTimeout(() => errorMsg.style.display = 'none', 5000);
    }
  </script>

</body>
</html>
