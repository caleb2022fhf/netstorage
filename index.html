<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Net Storage - Sign In</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #333;
    }

    .container {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      padding: 45px 40px;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .header {
      text-align: center;
      margin-bottom: 38px;
    }

    .header h1 {
      font-size: 2.1rem;
      font-weight: 700;
      color: #4f46e5;
      letter-spacing: -0.5px;
    }

    .header p {
      margin-top: 8px;
      color: #6b7280;
      font-size: 1.05rem;
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.25s ease;
      background: #f9fafb;
    }

    input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      background: white;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
    }

    .btn-primary {
      background: #4f46e5;
      color: white;
    }

    .btn-primary:hover {
      background: #4338ca;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
    }

    .btn-secondary {
      background: transparent;
      color: #4f46e5;
      border: 2px solid #4f46e5;
      margin-top: 16px;
    }

    .btn-secondary:hover {
      background: rgba(79, 70, 229, 0.08);
      transform: translateY(-2px);
    }

    .footer-text {
      text-align: center;
      margin-top: 28px;
      font-size: 0.95rem;
      color: #6b7280;
    }

    #message {
      margin-top: 24px;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      text-align: center;
      display: none;
    }

    .success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Net Storage</h1>
      <p>Find your beauty</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="netid">NetID</label>
        <input 
          type="text" 
          id="netid" 
          name="netid" 
          placeholder="Enter your NetID"
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn btn-primary">
        Submit
      </button>

      <button type="button" id="create-account-btn" class="btn btn-secondary">
        Create Account
      </button>
    </form>

    <div id="message"></div>

    <div class="footer-text">
      Secure & Private Storage • 2026
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const messageDiv = document.getElementById('message');
    const createBtn = document.getElementById('create-account-btn');

    // Redirect to create account page when clicking "Create Account"
    createBtn.addEventListener('click', () => {
      window.location.href = 'create.html';  // ← change this if your file has a different name
    });

    // Handle form submit → stay on page + show message
    form.addEventListener('submit', function(e) {
      e.preventDefault(); // ← this prevents page reload / navigation

      const netid = document.getElementById('netid').value.trim();
      const password = document.getElementById('password').value;

      if (!netid || !password) {
        showMessage('Please enter both NetID and password.', 'error');
        return;
      }

      // For now just showing success (no real backend)
      // You can later send data with fetch() / axios here
      showMessage(`Welcome back, ${netid}! 🎉`, 'success');

      // Optional: clear fields after "login"
      // form.reset();
    });

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = '';           // reset
      messageDiv.classList.add(type);      // success or error
      messageDiv.style.display = 'block';

      // Auto-hide after 6 seconds
      setTimeout(() => {
        messageDiv.style.display = 'none';
      }, 6000);
    }
  </script>

</body>
</html>
