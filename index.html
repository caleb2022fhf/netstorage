<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Net Storage - Sign In</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #333;
    }

    .container {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      padding: 45px 40px;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .header {
      text-align: center;
      margin-bottom: 38px;
    }

    .header h1 {
      font-size: 2.1rem;
      font-weight: 700;
      color: #4f46e5;
      letter-spacing: -0.5px;
    }

    .header p {
      margin-top: 8px;
      color: #6b7280;
      font-size: 1.05rem;
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.25s ease;
      background: #f9fafb;
    }

    input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      background: white;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
    }

    .btn-primary {
      background: #4f46e5;
      color: white;
    }

    .btn-primary:hover {
      background: #4338ca;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
    }

    .btn-secondary {
      background: transparent;
      color: #4f46e5;
      border: 2px solid #4f46e5;
      margin-top: 16px;
    }

    .btn-secondary:hover {
      background: rgba(79, 70, 229, 0.08);
      transform: translateY(-2px);
    }

    .footer-text {
      text-align: center;
      margin-top: 28px;
      font-size: 0.95rem;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Net Storage</h1>
      <p>Find your beauty</p>
    </div>

    <form>
      <div class="form-group">
        <label for="netid">NetID</label>
        <input 
          type="text" 
          id="netid" 
          name="netid" 
          placeholder="Enter your NetID"
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn btn-primary">
        Submit
      </button>

      <button type="button" class="btn btn-secondary">
        Create Account
      </button>
    </form>

    <div class="footer-text">
      Secure & Private Storage • 2026
    </div>
  </div>

</body>
</html>
